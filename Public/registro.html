<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="login-card">
        <div class="form-section">
            <h2>Crear Cuenta</h2>
            
            <form id="registerForm">
                <div class="input-group">
                    <label for="fullname">Nombre completo</label>
                    <input type="text" id="fullname" placeholder="Ej. Juan Pérez" required>
                </div>

                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary">Registrarse</button>
            </form>

            <div class="divider">
                <span>o</span>
            </div>

            <button type="button" class="btn btn-google">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.15C3.26 21.3 7.31 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.39l3.99-3.15z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.61l3.99 3.15c.95-2.85 3.6-4.96 6.72-4.96z"/>
                </svg>
                Registrarse con Google
            </button>

            <p class="register-text">
                ¿Ya tienes una cuenta? <a href="index.html">Iniciar Sesión</a>
            </p>
        </div>

        <div class="illustration-section">
            <div class="illustration-content">
                <svg viewBox="0 0 500 500" class="illustration-svg">
                    <circle cx="250" cy="250" r="180" fill="#a78bfa" opacity="0.3"/>
                    <circle cx="250" cy="250" r="130" fill="#8b5cf6" opacity="0.4"/>
                    <rect x="100" y="320" width="300" height="15" rx="5" fill="#4c1d95"/>
                    <rect x="130" y="335" width="15" height="80" fill="#3b0764"/>
                    <rect x="355" y="335" width="15" height="80" fill="#3b0764"/>
                    <rect x="190" y="220" width="120" height="80" rx="6" fill="#1e1b4b"/>
                    <rect x="195" y="225" width="110" height="70" rx="4" fill="#38bdf8"/>
                    <polygon points="230,300 270,300 280,320 220,320" fill="#64748b"/>
                    <circle cx="250" cy="150" r="30" fill="#fde047"/>
                    <path d="M220,200 C220,180 280,180 280,200 L290,260 L210,260 Z" fill="#ec4899"/>
                </svg>
            </div>
        </div>
    </div>

</body>
</html>
